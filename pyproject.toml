[project]
name = "arangodb-schema-analyzer"
version = "0.19.0"
description = "Agentic schema analyzer for ArangoDB: conceptual model + conceptual-to-physical mapping for transpilers."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Arthur Keen" },
]
maintainers = [
  { name = "Arthur Keen" },
]
keywords = [
  "arangodb",
  "schema",
  "graph",
  "conceptual-model",
  "ontology",
  "transpiler",
  "cypher",
  "sparql",
  "owl",
  "llm",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "python-arango>=8.1.1",
  "pydantic>=2.6.0",
  "jsonschema>=4.21.0",
]

[project.optional-dependencies]
# Class-abstraction discovery (PRD §6.3). Shared with relational-schema-analyzer so the
# two cannot drift on the sharedProperties/partialProperties split, which is a correctness
# boundary rather than a stylistic one. Optional: absent it, discovery is skipped.
taxonomy = ["conceptual-taxonomy>=0.1.1"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
openrouter = []  # uses stdlib urllib; listed for feature discoverability
mcp = ["mcp>=1.2.0"]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  # Banded: CI installs the newest ruff and its formatter output moves between
  # minors (0.15 -> 0.16 re-aligned trailing comments in five files). Keep local
  # and CI on one minor so `ruff format --check` means the same thing in both.
  "ruff>=0.16,<0.17",
  "mypy>=1.10.0",
  # The taxonomy wiring tests (tests/test_relational_enrichment_wiring.py) assert
  # discovery runs, so the dev environment must carry the optional dependency;
  # without it CI reported `unavailable` on every run since 2026-08-12.
  "conceptual-taxonomy>=0.1.1",
  # tests/test_owl_export.py parses the OWL export with a real RDF parser: the
  # only way to prove the Turtle is valid and means what it should (an
  # owl:unionOf domain, typed ranges). Test-only; the package never imports it.
  "rdflib>=7.0",
]

[project.urls]
Homepage = "https://github.com/ArthurKeen/arango-schema-analyzer"
Repository = "https://github.com/ArthurKeen/arango-schema-analyzer"
Issues = "https://github.com/ArthurKeen/arango-schema-analyzer/issues"
Changelog = "https://github.com/ArthurKeen/arango-schema-analyzer/blob/main/CHANGELOG.md"

[project.scripts]
arangodb-schema-analyzer = "schema_analyzer.cli:main"
arangodb-schema-analyzer-mcp = "schema_analyzer.mcp_server:main"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a running ArangoDB (typically via docker compose)"
]
addopts = "--cov=schema_analyzer --cov-report=term-missing"
filterwarnings = [
  # Transitive deprecation from starlette.testclient's use of httpx, surfaced by
  # the MCP remote-transport test (not our code). Suppressed so release runs are
  # clean; revisit when starlette/httpx settle the httpx2 migration.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
target-version = "py310"
line-length = 120
# Shared-memory hook templates are copied in verbatim from arango-shared-memory and
# linted there; linting the copies here fails CI on rules the template repo does not
# enforce (SIM105, formatting) without any local way to fix them.
extend-exclude = [".cursor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.hatch.build.targets.wheel]
packages = ["schema_analyzer"]

[tool.hatch.build.targets.sdist]
# Strict allow-list: only these paths go into the sdist.
only-include = [
  "schema_analyzer",
  "docs/tool-contract",
  "docs/csi",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "LICENSE",
  "pyproject.toml",
]
